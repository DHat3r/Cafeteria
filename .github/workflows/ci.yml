name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Si llega un nuevo commit a la misma rama, cancela la ejecución anterior
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# El workflow solo necesita leer el código del repositorio
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      # Descarga el código del repositorio en la máquina de CI
      - uses: actions/checkout@v4

      # Instala Node con la versión de .nvmrc y cachea las dependencias de npm
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # Instala las dependencias exactamente como están en package-lock.json
      - name: Instalar dependencias
        run: npm ci

      # Revisa el estilo y los errores de código en todos los workspaces
      - name: Lint
        run: npm run lint

      # Vitest falla si no encuentra tests, así que un archivo mal nombrado no pasa en silencio
      - name: Tests
        run: npm test

      # Compila shared, api y web para confirmar que el proyecto construye
      - name: Build
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      # Descarga el código para tener los Dockerfiles y docker-compose.yml
      - uses: actions/checkout@v4

      # docker-compose.yml exige los secretos: se generan aleatorios, como lo haría cualquiera que clone el repo
      - name: Crear .env
        run: node scripts/crear-env.mjs

      # Construye las imágenes definidas en docker-compose.yml
      - name: Construir imágenes Docker
        run: docker compose build
