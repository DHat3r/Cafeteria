# Levanta la API, el frontend y un servidor de correo falso para desarrollo.
# Uso: docker compose up -d --build
# Los puertos se pueden cambiar con variables de entorno (ver .env.example).

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "${API_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "${WEB_PORT:-3000}:3000"
    environment:
      # Dentro de la red de compose la API se llama "api", no localhost
      API_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy

  mailpit:
    # Servidor SMTP falso: los correos no salen de la maquina.
    # La bandeja web queda en http://localhost:8025
    image: axllent/mailpit:v1.33.0
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
